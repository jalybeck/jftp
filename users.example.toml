# Copy this file to the server's per-user jftp config directory as users.toml.
# Replace the authorized_keys value with the contents of the client's .pub file.

[[users]]
name = "alice"
home = "."
authorized_keys = ["ssh-ed25519 REPLACE_WITH_CLIENT_PUBLIC_KEY alice@client"]

[users.permissions]
read = true
write = true
delete = true
