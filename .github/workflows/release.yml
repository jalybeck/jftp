name: Release

# Push a tag such as build-2026-10-01 to publish a new build.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: jftp_win_x64.zip
          - os: ubuntu-latest
            archive: jftp_linux_x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked --bins

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/jftp.exe,target/release/jftp-server.exe,target/release/jftp-server-admin.exe -DestinationPath ${{ matrix.archive }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.archive }}" -C target/release jftp jftp-server jftp-server-admin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/jftp_win_x64.zip dist/jftp_linux_x64.tar.gz \
            --title "jftp (build $RELEASE_TAG)" \
            --notes "Automatic build of jftp, jftp-server, and jftp-server-admin." \
            --verify-tag \
            --latest

      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          while IFS= read -r old_tag; do
            if [ "$old_tag" != "$RELEASE_TAG" ]; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName -q '.[].tagName')

      - name: Update README download table
        env:
          RELEASE_REPO: ${{ github.repository }}
        run: python3 scripts/update_release_table.py "$RELEASE_REPO"

      - name: Commit README
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update build table [skip ci]"
          git push origin "HEAD:$DEFAULT_BRANCH"
